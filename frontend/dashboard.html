<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/products.html">Products</a>
        <a href="/forecast.html">Forecast</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
    <div class="container">
        <h1>Dashboard</h1>
        <div class="summary-cards">
            <div class="card">Total Products: <span id="totalProducts">-</span></div>
            <div class="card">Total Stock: <span id="totalStock">-</span></div>
            <div class="card">Low Stock: <span id="lowStock">-</span></div>
            <div class="card">Total Sales (30d): <span id="totalSales">-</span></div>
        </div>
        <div style="margin-bottom: 20px;">
            <label for="dashboardProductSelect"><strong>Select Product for Forecast:</strong></label>
            <select id="dashboardProductSelect" onchange="updateDashboardChart()">
                <!-- Populated by JS -->
            </select>
        </div>
        <div style="display:flex; flex-wrap:wrap;">
            <div style="width:45%; margin:10px;"><canvas id="salesChart"></canvas></div>
            <div style="width:45%; margin:10px;"><canvas id="forecastChart"></canvas></div>
        </div>
        <h2>Inventory Recommendations</h2>
        <table id="recomTable">
            <thead><tr><th>Product</th><th>Stock</th><th>Forecast</th><th>Recommendation</th><th>Status</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
